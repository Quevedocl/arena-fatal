    #loading::after {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(120% 80% at 50% 120%, rgba(255,106,31,0.30) 0%, rgba(255,106,31,0) 55%),
        linear-gradient(180deg, rgba(8,7,10,0.72) 0%, rgba(8,7,10,0.86) 45%, rgba(8,7,10,0.97) 100%);
    }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading-mark { width: min(320px, 72vw); height: auto; filter: brightness(1.45) contrast(1.06) saturate(1.12) drop-shadow(0 6px 26px rgba(255,106,31,0.35)); }
    #game-title {
      margin: 0; font-size: clamp(15px, 2.6vw, 20px); font-weight: 700;
      letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase; color: var(--oro);
    }
    #loading-status { margin: 0; font-size: clamp(14px, 2.4vw, 17px); font-weight: 500; color: var(--hueso); }
    #loading progress {
      display: block; width: min(360px, 78vw); height: 8px; border: 0; border-radius: 20px;
      overflow: hidden; accent-color: var(--ascua); background: rgba(244,236,224,0.16);
    }
    #loading progress::-webkit-progress-bar { background: rgba(244,236,224,0.16); border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: linear-gradient(90deg, var(--ascua), var(--oro)); border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: linear-gradient(90deg, var(--ascua), var(--oro)); border-radius: 20px; }
    #loading-notice { max-width: 400px; line-height: 1.5; font-size: 14px; color: rgba(244,236,224,0.82); }
    #loading button {
      min-height: 46px; padding: 12px 26px; cursor: pointer; font: inherit; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--ascua);
      border-radius: 10px; background: rgba(8,7,10,0.86); color: var(--hueso);
    }
    #loading button:hover { background: var(--ascua); color: #150802; }
    #loading button:focus-visible { outline: 3px solid var(--oro); outline-offset: 4px; }
    #loading-hint { font-size: 13px; letter-spacing: 0.08em; color: rgba(244,236,224,0.62); }
    @media (prefers-reduced-motion: no-preference) {
      #loading-mark { animation: latido 2.6s ease-in-out infinite; }
      @keyframes latido {
        0%, 100% { filter: brightness(1.45) contrast(1.06) saturate(1.12) drop-shadow(0 6px 26px rgba(255,106,31,0.30)); }
        50% { filter: brightness(1.6) contrast(1.06) saturate(1.18) drop-shadow(0 6px 34px rgba(255,106,31,0.62)); }
      }
    }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) {
      #loading { gap: 10px; }
      #loading-mark { width: min(200px, 34vw); }
      #loading-hint { display: none; }
    }
  </style>
</head>

      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.getElementById('game-title').textContent = document.title;
      document.documentElement.lang = 'es';
      const LABEL_LOAD = 'Cargando la arena…';
      const LABEL_START = 'Iniciando el combate…';
      const LABEL_FAIL = 'No se pudo cargar el juego. Inténtalo de nuevo.';
      const LABEL_STALL = 'Lleva un rato descargando. Puedes esperar o reintentar.';

      retry.addEventListener('click', () => window.location.reload());

      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {

        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000 ? LABEL_FROZE : LABEL_STALL;

        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;

      window.addEventListener('unhandledrejection', onUnhandledRejection);
